{% extends 'base.html' %}

{% block title %}404 - Page Not Found | AGRI-MITRA{% endblock %}

{% block content %}
<div class="container" style="text-align: center; padding: 80px 20px;">
  <div style="font-size: 4rem; margin-bottom: 10px;">🌾</div>
  <h1 style="font-size: 2.5rem; color: var(--primary-900); margin-bottom: 12px;">404 - Page Not Found</h1>
  <p style="color: var(--text-muted); font-size: 1.1rem; max-width: 500px; margin: 0 auto 30px;">
    The agricultural advisory page, report, or model endpoint you requested does not exist or has moved.
  </p>
  <div style="display: flex; gap: 12px; justify-content: center;">
    <a href="{{ url_for('home.index') }}" class="btn btn-primary">Return to Homepage</a>
    <a href="{{ url_for('dashboard.index') }}" class="btn btn-secondary">Go to Dashboard</a>
  </div>
</div>
{% endblock %}
