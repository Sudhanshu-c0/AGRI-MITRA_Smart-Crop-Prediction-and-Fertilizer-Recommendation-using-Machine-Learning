{% extends 'base.html' %}

{% block title %}Change Password | AGRI-MITRA{% endblock %}

{% block extra_css %}
<link rel="stylesheet" href="{{ url_for('static', filename='css/profile.css') }}">
{% endblock %}

{% block content %}
<div class="container">
  <div class="profile-grid">
    {% include 'profile/_sidebar.html' %}
    <div class="card profile-form-card">
      <div class="card-header">
        <h2 class="card-title">🔒 Update Password</h2>
      </div>

      <form method="POST" action="{{ url_for('profile.change_pwd') }}" id="changePwdForm">
        <div class="form-group">
          <label class="form-label" for="current_password">Current Password</label>
          <input type="password" class="form-control" id="current_password" name="current_password" required autofocus>
        </div>

        <div class="form-group">
          <label class="form-label" for="new_password">New Password</label>
          <input type="password" class="form-control" id="new_password" name="new_password" placeholder="At least 6 characters" required>
        </div>

        <div class="form-group">
          <label class="form-label" for="confirm_password">Confirm New Password</label>
          <input type="password" class="form-control" id="confirm_password" name="confirm_password" placeholder="Re-type new password" required>
        </div>

        <div class="profile-form-actions">
          <a href="{{ url_for('profile.index') }}" class="btn btn-secondary">Cancel</a>
          <button type="submit" class="btn btn-primary">Update Password</button>
        </div>
      </form>
    </div>
  </div>
</div>
{% endblock %}

{% block extra_js %}
<script src="{{ url_for('static', filename='js/profile.js') }}"></script>
{% endblock %}
