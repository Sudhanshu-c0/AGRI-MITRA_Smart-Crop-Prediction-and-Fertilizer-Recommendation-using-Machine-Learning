{% extends 'base.html' %}

{% block title %}Edit Profile | AGRI-MITRA{% endblock %}

{% block extra_css %}
<link rel="stylesheet" href="{{ url_for('static', filename='css/profile.css') }}">
{% endblock %}

{% block content %}
<div class="container" style="max-width: 680px;">
  <div class="card">
    <div class="card-header">
      <h2 class="card-title">✏️ Update Profile Information</h2>
      <a href="{{ url_for('profile.index') }}" class="btn btn-secondary btn-sm">&larr; Back to Profile</a>
    </div>

    <form method="POST" action="{{ url_for('profile.edit') }}">
      <div class="form-group">
        <label class="form-label" for="full_name">Full Name</label>
        <input type="text" class="form-control" id="full_name" name="full_name" value="{{ user.full_name }}" required>
      </div>

      <div class="form-group">
        <label class="form-label" for="email">Email Address</label>
        <input type="email" class="form-control" id="email" name="email" value="{{ user.email }}" required>
      </div>

      <div class="form-row">
        <div class="form-group">
          <label class="form-label" for="phone">Phone Number</label>
          <input type="tel" class="form-control" id="phone" name="phone" value="{{ user.phone or '' }}" placeholder="+91 9876543210">
        </div>
        <div class="form-group">
          <label class="form-label" for="location">Farming District / State</label>
          <input type="text" class="form-control" id="location" name="location" value="{{ user.location or '' }}" placeholder="e.g. Nashik, Maharashtra">
        </div>
      </div>

      <div style="margin-top: 24px; display: flex; gap: 12px; justify-content: flex-end;">
        <a href="{{ url_for('profile.index') }}" class="btn btn-secondary">Cancel</a>
        <button type="submit" class="btn btn-primary">Save Profile Changes</button>
      </div>
    </form>
  </div>
</div>
{% endblock %}
